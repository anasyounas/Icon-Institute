# nginx configuration for the ICON-INSTITUTE static site + CMS admin.
#
# Two things matter here:
#
# 1. SPA routing. The site uses the History API, so the server must answer
#    every unknown path with index.html and let React Router resolve it.
#    Without `try_files`, deep links such as /news, /jobs and /admin/login
#    return 404 on a direct visit or hard reload.
#
# 2. Header inheritance. nginx drops every inherited `add_header` in any
#    location that declares one of its own, so the security headers below are
#    repeated in each location that sets Cache-Control. That repetition is
#    deliberate — removing it silently loses the headers (review response §02).

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml;

    # HSTS is added by the TLS terminator in front of this container, which is
    # where HTTPS actually ends.
    add_header X-Content-Type-Options    "nosniff"                                 always;
    add_header X-Frame-Options           "DENY"                                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff"                                 always;
        add_header X-Frame-Options        "DENY"                                    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"         always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control          "public, immutable"                       always;
        expires 1y;
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep an old app shell
    # pointing at build assets that no longer exist after a redeploy.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff"                                 always;
        add_header X-Frame-Options        "DENY"                                    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"         always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control          "no-store, must-revalidate"               always;
    }

    # SPA fallback — this is what makes /news, /jobs, /projects, /admin/login
    # and every other route work on a direct visit or hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
